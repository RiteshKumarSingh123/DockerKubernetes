apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - namespaces
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: default

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: default
spec:
  selector:
    matchLabels:
      app: alloy

  template:
    metadata:
      labels:
        app: alloy

    spec:
      serviceAccountName: alloy

      containers:
        - name: alloy
          image: grafana/alloy:latest

          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data

          volumeMounts:
            - name: config
              mountPath: /etc/alloy

            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: alloy-data
              mountPath: /var/lib/alloy/data

      volumes:
        - name: config
          configMap:
            name: alloy-config

        - name: varlog
          hostPath:
            path: /var/log

        - name: alloy-data
          emptyDir: {}