apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "h2projectcrud.fullname" . }}
  labels:
    {{- include "h2projectcrud.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      {{- include "h2projectcrud.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "h2projectcrud.selectorLabels" . | nindent 8 }}

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: h2projectcrud

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http

            initialDelaySeconds: 30
            periodSeconds: 20
