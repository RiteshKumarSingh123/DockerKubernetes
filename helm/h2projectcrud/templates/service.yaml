apiVersion: v1
kind: Service

metadata:
  name: {{ include "h2projectcrud.fullname" . }}
  labels:
    {{- include "h2projectcrud.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "h2projectcrud.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
