replicaCount: 3

image:
  repository: riteshthedaku/h2projectcrud
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  host: h2projectcrud.example.com

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []